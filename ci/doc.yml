name: xskillscore-docs
channels:
  - conda-forge
dependencies:
  - python >=3.10,<3.14
  - pip >=23.0
  - bottleneck
  - cftime
  - dask-core >=2023.4.0
  - doc8
  - ipykernel
  - ipython
  - matplotlib-base
  - nbsphinx
  - numba >=0.57
  - numpy >=1.25
  - properscoring
  - scikit-learn
  - scipy >=1.10
  # sphinx <9: sphinx-autosummary-accessors 2025.3.1 (latest) calls
  # Autosummary.create_documenter, removed in Sphinx 9 -> conf.py import fails
  - sphinx >=6.0.0,<9
  - sphinx_rtd_theme >=1.0
  - sphinx-autosummary-accessors
  - sphinx-copybutton
  - sphinx-llm
  - statsmodels
  - xarray >=2023.4.0
  - xhistogram>=0.3.2
