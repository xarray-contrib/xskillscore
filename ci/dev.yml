name: xskillscore-dev
channels:
  - conda-forge
dependencies:
  - python >= 3.11,<3.15
  - pip >= 23.0
  # Documentation
  - matplotlib-base
  - nbsphinx
  - nbstripout
  # sphinx <9: sphinx-autosummary-accessors 2025.3.1 (latest) calls
  # Autosummary.create_documenter, removed in Sphinx 9 -> conf.py import fails
  - sphinx >=6.0.0,<9
  - sphinx_rtd_theme >=1.0
  - sphinx-autosummary-accessors
  # IDE
  - jupyterlab
  # Numerics
  - bottleneck
  - cftime
  - dask-core >=2023.4.0
  - numba >=0.57
  - numpy >=1.25
  - properscoring
  - scikit-learn
  - scipy >=1.10.0
  - statsmodels
  - xarray>=2023.4.0
  - xhistogram>=0.3.2
  # Package Management
  - asv
  - build
  - coveralls
  - doc8
  - pre-commit
  - pytest
  - pytest-cov
  - pytest-sugar
  - pytest-timeout
  - pytest-xdist
  - mypy
  - ruff
